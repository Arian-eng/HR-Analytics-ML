name: Python CI

on:
  push:
    branches: [main, feature/thesis-analysis]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile source
        run: |
          python -m py_compile run_all.py
          python -m py_compile src/preprocessing.py
          python -m py_compile src/classification.py
          python -m py_compile src/clustering.py
          python -m py_compile src/evaluation.py
          python -m py_compile src/green_hrm_analysis.py

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -f run_all.py
          test -f src/preprocessing.py
          test -f src/classification.py
          test -f src/clustering.py
          test -f src/evaluation.py
          test -f src/green_hrm_analysis.py
          test -d outputs
          test -d figures
