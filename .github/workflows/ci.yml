name: Python CI

on:
  push:
    branches: [main, feature/thesis-analysis]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile source
        run: |
          python -m compileall -q run_all.py src tests

      - name: Run data-free unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -f run_all.py
          test -f src/preprocessing.py
          test -f src/classification.py
          test -f src/clustering.py
          test -f src/evaluation.py
          test -f src/green_hrm_analysis.py
          test -f src/reporting.py
          test -f tests/test_pipeline.py
          test -f results/chapter4_results.md
          test -f results/tables/classification_metrics.csv
          test -f results/figures/classification_f1.png
          test -d outputs
          test -d figures
